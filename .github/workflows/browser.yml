name: Browser

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: "10"
            php: "8.2"
            testbench: "^8.0"
            legacy: true
          - laravel: "11"
            php: "8.2"
            testbench: "^9.0"
            legacy: true
          - laravel: "12"
            php: "8.2"
            testbench: "^10.0"
            legacy: false
          - laravel: "13"
            php: "8.3"
            testbench: "^11.0"
            legacy: false

    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer require --dev orchestra/testbench:${{ matrix.testbench }} --no-update

      - run: composer update --prefer-dist --no-interaction
        env:
          COMPOSER_NO_SECURITY_BLOCKING: ${{ matrix.legacy && '1' || '0' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-tests/package-lock.json

      - run: npm ci
        working-directory: browser-tests

      - run: npx playwright install --with-deps chromium
        working-directory: browser-tests

      - run: npm test
        working-directory: browser-tests

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-laravel-${{ matrix.laravel }}
          path: browser-tests/playwright-report/
          retention-days: 7
