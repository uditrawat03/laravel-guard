name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: vendor/bin/pint --test
      - run: composer test
      - run: composer archive --format=zip --file=laravel-guard
      - run: sha256sum laravel-guard.zip > laravel-guard.zip.sha256
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: laravel-guard.zip
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            laravel-guard.zip
            laravel-guard.zip.sha256
