name: Coverage Budget

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    name: Laravel 13 / PHP 8.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
      - run: composer require --dev "orchestra/testbench:^11.0" --no-update
      - run: composer update --prefer-dist --no-interaction
      - run: mkdir -p build
      - name: Run coverage suite
        run: vendor/bin/phpunit --coverage-clover=build/coverage.xml --coverage-text
      - name: Enforce coverage budget
        run: php .github/scripts/verify-coverage.php build/coverage.xml 60
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: coverage-report
          path: build/coverage.xml
          if-no-files-found: error
